<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trạm Sạc FocusPet 🐾</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #111827;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }

    .station-card {
      background: rgba(31, 41, 55, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 30px 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 340px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* ĐỒNG HỒ ĐẾM NGƯỢC PHÍA TRÊN */
    .timer-header {
      font-size: 38px;
      font-weight: 800;
      color: #f1c40f;
      letter-spacing: 1.5px;
      font-family: 'Courier New', Courier, monospace;
      margin-bottom: 15px;
      text-shadow: 0 2px 10px rgba(241, 196, 15, 0.3);
    }

    /* KHUNG VÒNG TRÒN TRUNG TÂM */
    .circle-container {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    .progress-ring {
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    .progress-ring__circle-bg {
      stroke: rgba(255, 255, 255, 0.08);
    }

    .progress-ring__circle {
      stroke: #2ecc71;
      stroke-dasharray: 565.48;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.5s linear, stroke 0.3s ease;
      stroke-linecap: round;
    }

    /* PET ANIMATION Ở GIỮA VÒNG TRÒN */
    .pet-wrapper {
      position: absolute;
      width: 120px;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pet-avatar {
      width: 100px;
      height: 100px;
      object-fit: contain;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4));
      transition: all 0.3s ease;
    }

    /* TIÊU ĐỀ VÀ BADGE TRẠNG THÁI PHÍA DƯỚI */
    .status-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #2ecc71;
      transition: color 0.3s ease;
    }

    .status-desc {
      font-size: 12px;
      color: #9ca3af;
      line-height: 1.4;
      margin-bottom: 18px;
      padding: 0 10px;
    }

    .status-badge {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 12px;
      background: #2ecc71;
      color: #ffffff;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
      transition: all 0.3s ease;
    }

    /* ĐỔI MÀU TRẠNG THÁI */
    .status-badge.warning { background: #e74c3c; box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3); }
    .status-badge.paused { background: #e67e22; box-shadow: 0 4px 12px rgba(230, 126, 34, 0.3); }
    .status-badge.break { background: #3498db; box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3); }
    .status-badge.locked { background: #95a5a6; box-shadow: 0 4px 12px rgba(149, 165, 166, 0.3); }
  </style>
</head>
<body>

  <div class="station-card" id="mainCard">
    <!-- 1. THỜI GIAN ĐẾM NGƯỢC PHÍA TRÊN -->
    <div class="timer-header" id="timerDisplay">25:00</div>

    <!-- 2. VÒNG TRÒN TIẾN TRÌNH VÀ PET GIF Ở GIỮA -->
    <div class="circle-container">
      <svg class="progress-ring" width="200" height="200">
        <circle class="progress-ring__circle-bg" stroke-width="8" fill="transparent" r="90" cx="100" cy="100"/>
        <circle class="progress-ring__circle" id="progressCircle" stroke-width="8" fill="transparent" r="90" cx="100" cy="100"/>
      </svg>
      <div class="pet-wrapper">
        <img id="petImg" class="pet-avatar" src="" alt="FocusPet">
      </div>
    </div>

    <!-- 3. TRẠNG THÁI PHÍA DƯỚI -->
    <div class="status-title" id="statusTitle">Đang Trong Trạm Sạc</div>
    <div class="status-desc" id="statusDesc">Đặt điện thoại xuống bàn để cùng Pet tập trung học bài nhé!</div>
    <div class="status-badge" id="statusBadge">ĐANG TẬP TRUNG</div>
  </div>

  <script>
    const FIREBASE_DB_URL = "https://web---focuspet-default-rtdb.asia-southeast1.firebasedatabase.app/";
    
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session');

    const timerDisplay = document.getElementById('timerDisplay');
    const progressCircle = document.getElementById('progressCircle');
    const petImg = document.getElementById('petImg');
    const statusTitle = document.getElementById('statusTitle');
    const statusDesc = document.getElementById('statusDesc');
    const statusBadge = document.getElementById('statusBadge');

    const circleRadius = 90;
    const circumference = 2 * Math.PI * circleRadius;
    progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;

    // TẠO TOKEN ĐỊNH DẠNG DUY NHẤT CHO THIẾT BỊ NÀY
    let myDeviceToken = localStorage.getItem('focuspet_device_token');
    if (!myDeviceToken) {
      myDeviceToken = 'device_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('focuspet_device_token', myDeviceToken);
    }

    let isDeviceAuthorized = false;

    function setProgress(percent, color = '#2ecc71') {
      const offset = circumference - (percent / 100 * circumference);
      progressCircle.style.strokeDashoffset = offset;
      progressCircle.style.stroke = color;
    }

    function getPetStagePrefix(level = 1) {
      if (level < 3) return 'egg';
      if (level < 6) return 'baby';
      return 'adult';
    }

    // ĐĂNG KÝ VÀ RÀNG BUỘC THIẾT BỊ ĐƠN (DEVICE LOCK)
    async function claimOrValidateDevice() {
      if (!sessionId) return false;
      try {
        const res = await fetch(`${FIREBASE_DB_URL}/sessions/${sessionId}/activeDevice.json`);
        const activeDevice = await res.json();

        const now = Date.now();
        // Nếu chưa có thiết bị nào đăng ký hoặc thiết bị cũ đã ngắt kết nối quá 30s
        if (!activeDevice || !activeDevice.token || activeDevice.token === myDeviceToken || (now - activeDevice.lastPing > 30000)) {
          // Khóa Session này cho thiết bị hiện tại
          await fetch(`${FIREBASE_DB_URL}/sessions/${sessionId}/activeDevice.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: myDeviceToken, lastPing: now })
          });
          isDeviceAuthorized = true;
          return true;
        } else {
          // Bị từ chối vì đã có thiết bị khác truy cập
          isDeviceAuthorized = false;
          showDeviceLockedScreen();
          return false;
        }
      } catch (e) {
        return false;
      }
    }

    function showDeviceLockedScreen() {
      statusTitle.innerText = "🔒 THIẾT BỊ BỊ TỪ CHỐI";
      statusTitle.style.color = "#e74c3c";
      statusDesc.innerText = "Trạm sạc này đang được sử dụng bởi một điện thoại khác!";
      statusBadge.innerText = "ĐÃ KHÓA";
      statusBadge.className = "status-badge locked";
      petImg.src = "pet/penguin/egg-warning.gif";
      setProgress(100, "#95a5a6");
    }

    // 1. GỬI TÍN HIỆU CẢNH BÁO KHI RỜI/VÀO LẠI TRẠM SẠC
    async function sendSignal(isDistracted) {
      if (!sessionId || !isDeviceAuthorized) return;
      try {
        await fetch(`${FIREBASE_DB_URL}/sessions/${sessionId}.json`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mobileDistracted: isDistracted,
            updatedAt: Date.now()
          })
        });

        // Ping cập nhật sự sống của thiết bị
        await fetch(`${FIREBASE_DB_URL}/sessions/${sessionId}/activeDevice.json`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lastPing: Date.now() })
        });
      } catch (e) {}
    }

    // Khởi tạo đăng ký thiết bị
    claimOrValidateDevice().then(authorized => {
      if (authorized) sendSignal(false);
    });

    // 2. LẤY TRẠNG THÁI VÀ CẬP NHẬT GIAO DIỆN REAL-TIME
    setInterval(async () => {
      if (!sessionId || document.hidden) return;

      // Xung nhịp kiểm tra bản quyền thiết bị
      const authorized = await claimOrValidateDevice();
      if (!authorized) return;

      try {
        const res = await fetch(`${FIREBASE_DB_URL}/sessions/${sessionId}/desktopState.json`);
        const data = await res.json();

        if (data) {
          // Cập nhật đồng hồ đếm ngược
          const secondsLeft = data.timeLeft || 0;
          const mins = Math.floor(secondsLeft / 60);
          const secs = secondsLeft % 60;
          timerDisplay.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

          const totalDuration = data.mode === 'BREAK' ? 300 : 1500; 
          const progressPercent = Math.min(100, Math.max(0, (secondsLeft / totalDuration) * 100));

          const petType = data.petType || 'penguin';
          const level = data.level || 1;
          const prefix = getPetStagePrefix(level);

          if (!data.isRunning || data.petState === 'PAUSED') {
            setProgress(progressPercent, '#e67e22');
            petImg.src = `pet/${petType}/${prefix}-paused.gif`;
            statusBadge.innerText = "TẠM DỪNG";
            statusBadge.className = "status-badge paused";
            statusTitle.innerText = "Tạm Dừng Tập Trung";
            statusTitle.style.color = "#e67e22";
          } else if (data.mode === 'BREAK' || data.petState === 'BREAK') {
            setProgress(progressPercent, '#3498db');
            petImg.src = `pet/${petType}/${prefix}-break.gif`;
            statusBadge.innerText = "GIỜ NGHỈ NGƠI";
            statusBadge.className = "status-badge break";
            statusTitle.innerText = "Thư Giãn Thôi~";
            statusTitle.style.color = "#3498db";
          } else if (data.petState === 'WARNING') {
            setProgress(100, '#e74c3c');
            petImg.src = `pet/${petType}/${prefix}-warning.gif`;
            statusBadge.innerText = "CẢNH BÁO XAO NHÃNG";
            statusBadge.className = "status-badge warning";
            statusTitle.innerText = "Mau Quay Lại Học!";
            statusTitle.style.color = "#e74c3c";
          } else if (data.petState === 'DISTRACTED') {
            setProgress(100, '#e74c3c');
            petImg.src = `pet/${petType}/${prefix}-distracted.gif`;
            statusBadge.innerText = "BỊ TRỪ EXP!";
            statusBadge.className = "status-badge warning";
            statusTitle.innerText = "Đã Bị Trừ Điểm!";
            statusTitle.style.color = "#e74c3c";
          } else {
            setProgress(progressPercent, '#2ecc71');
            petImg.src = `pet/${petType}/${prefix}-focus.gif`;
            statusBadge.innerText = "ĐANG TẬP TRUNG";
            statusBadge.className = "status-badge";
            statusTitle.innerText = "Đang Trong Trạm Sạc";
            statusTitle.style.color = "#2ecc71";
          }
        }
      } catch (e) {}
    }, 1500);

    // XỬ LÝ SỰ KIỆN RỜI TRẠM SẠC
    document.addEventListener("visibilitychange", () => {
      if (!isDeviceAuthorized) return;

      if (document.hidden) {
        sendSignal(true);
        statusTitle.innerText = "⚠️ XAO NHÃNG!";
        statusTitle.style.color = "#e74c3c";
        statusDesc.innerText = "Bạn đã rời khỏi Trạm Sạc! Pet trên máy tính đang bị ảnh hưởng!";
        statusBadge.innerText = "CẢNH BÁO";
        statusBadge.className = "status-badge warning";
      } else {
        sendSignal(false);
        statusDesc.innerText = "Đặt điện thoại xuống bàn để cùng Pet tập trung học bài nhé!";
      }
    });
  </script>
</body>
</html>
