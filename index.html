<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trạm Sạc FocusPet 🐾</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #1e272e;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 30px 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 100%;
      max-width: 340px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }
    .pet-icon { font-size: 65px; margin-bottom: 10px; }
    .timer { font-size: 38px; font-weight: bold; color: #f1c40f; margin: 8px 0; font-family: monospace; }
    h1 { font-size: 18px; margin-bottom: 6px; color: #2ecc71; transition: color 0.3s ease; }
    p { font-size: 12px; color: #dcdde1; line-height: 1.5; margin-bottom: 20px; }
    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 12px;
      background: #2ecc71;
      color: #fff;
      transition: background 0.3s ease;
    }
    .status-badge.warning { background: #e74c3c; }
    .status-badge.paused { background: #e67e22; }
    .status-badge.break { background: #3498db; }
  </style>
</head>
<body>
  <div class="card">
    <div class="pet-icon" id="petIcon">🐧</div>
    <div class="timer" id="timerDisplay">25:00</div>
    <h1 id="statusTitle">Đang Trong Trạm Sạc</h1>
    <p id="statusDesc">Hãy giữ nguyên màn hình này và đặt điện thoại xuống bàn để cùng Pet tập trung nhé!</p>
    <div class="status-badge" id="statusBadge">ĐANG TẬP TRUNG</div>
  </div>

  <script>
    const FIREBASE_DB_URL = "https://web---focuspet-default-rtdb.asia-southeast1.firebasedatabase.app/";
    
    // Lấy Session ID từ URL
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session');

    const statusTitle = document.getElementById('statusTitle');
    const statusDesc = document.getElementById('statusDesc');
    const statusBadge = document.getElementById('statusBadge');
    const petIcon = document.getElementById('petIcon');
    const timerDisplay = document.getElementById('timerDisplay');

    const petEmojis = {
      penguin: '🐧',
      cat: '🐱',
      phoenix: '🐦'
    };

    // 1. GỬI TÍN HIỆU CẢNH BÁO LÊN FIREBASE KHI RỜI / QUAY LẠI TRẠM SẠC
    async function sendSignal(isDistracted) {
      if (!sessionId) return;
      try {
        await fetch(`${FIREBASE_DB_URL}/sessions/${sessionId}.json`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mobileDistracted: isDistracted,
            updatedAt: Date.now()
          })
        });
      } catch (e) {}
    }

    // Báo an toàn khi vừa tải trang
    sendSignal(false);

    // 2. ĐỌC ĐỒNG BỘ TẤT CẢ TRẠNG THÁI TỪ EXTENSION VỀ MOBILE MỖI 1 GIÂY
    setInterval(async () => {
      if (!sessionId || document.hidden) return;
      try {
        const res = await fetch(`${FIREBASE_DB_URL}/sessions/${sessionId}/desktopState.json`);
        const data = await res.json();

        if (data) {
          // Đồng bộ đếm ngược Pomodoro
          const mins = Math.floor((data.timeLeft || 0) / 60);
          const secs = (data.timeLeft || 0) % 60;
          timerDisplay.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

          const defaultEmoji = petEmojis[data.petType] || '🐧';

          // Đồng bộ ĐỦ các trạng thái thực tế từ Extension
          if (!data.isRunning || data.petState === 'PAUSED') {
            statusBadge.innerText = "TẠM DỪNG";
            statusBadge.className = "status-badge paused";
            statusTitle.innerText = "Tạm dừng tập trung";
            statusTitle.style.color = "#e67e22";
            petIcon.innerText = "😴";
          } else if (data.mode === 'BREAK' || data.petState === 'BREAK') {
            statusBadge.innerText = "GIỜ NGHỈ NGƠI";
            statusBadge.className = "status-badge break";
            statusTitle.innerText = "Thư giãn thôi~";
            statusTitle.style.color = "#3498db";
            petIcon.innerText = "☕";
          } else if (data.petState === 'WARNING') {
            statusBadge.innerText = "CẢNH BÁO XAO NHÃNG";
            statusBadge.className = "status-badge warning";
            statusTitle.innerText = "Mau quay lại học bài!";
            statusTitle.style.color = "#e74c3c";
            petIcon.innerText = "⚠️";
          } else if (data.petState === 'DISTRACTED') {
            statusBadge.innerText = "BỊ TRỪ EXP!";
            statusBadge.className = "status-badge warning";
            statusTitle.innerText = "Đã bị trừ điểm!";
            statusTitle.style.color = "#e74c3c";
            petIcon.innerText = "😭";
          } else {
            // Trạng thái FOCUS chuẩn
            statusBadge.innerText = "ĐANG TẬP TRUNG";
            statusBadge.className = "status-badge";
            statusTitle.innerText = "Đang Trong Trạm Sạc";
            statusTitle.style.color = "#2ecc71";
            petIcon.innerText = defaultEmoji;
          }
        }
      } catch (e) {}
    }, 1000);

    // LẮNG NGHE SỰ KIỆN THOÁT ỨNG DỤNG / QUAY LẠI TRẠM SẠC
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        sendSignal(true);
        statusTitle.innerText = "⚠️ XAO NHÃNG!";
        statusTitle.style.color = "#e74c3c";
        statusDesc.innerText = "Bạn đã rời khỏi Trạm Sạc! Pet trên máy tính đang bị ảnh hưởng!";
        statusBadge.innerText = "CẢNH BÁO";
        statusBadge.className = "status-badge warning";
        petIcon.innerText = "😭";
      } else {
        sendSignal(false);
        statusTitle.style.color = "#2ecc71";
        statusTitle.innerText = "Đang Trong Trạm Sạc";
        statusDesc.innerText = "Hãy giữ nguyên màn hình này và đặt điện thoại xuống bàn để cùng Pet tập trung nhé!";
        statusBadge.innerText = "ĐANG TẬP TRUNG";
        statusBadge.className = "status-badge";
      }
    });
  </script>
</body>
</html>
